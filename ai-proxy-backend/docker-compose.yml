version: "3.9"

services:

  api:
    build: .
    container_name: learning-ai-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: learning-ai-postgres

    environment:
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning_password
      POSTGRES_DB: learning_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  adminer:
    image: adminer
    container_name: learning-ai-db-viewer

    ports:
      - "8080:8080"

    depends_on:
      - postgres


volumes:
  postgres_data: